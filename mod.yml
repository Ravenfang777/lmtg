title: KH1FM Redesigned Five-Slot LIMIT Gauge (v2.1)
originalAuthor: Raven Fang
description: >-
  Rebuilds the five-slot LIMIT gauge from the supplied redesigned images and
  displays it at half scale by default. Empty slots use gray shading and a
  black stepped back; filled slots use red shading with a cyan-teal outline at
  20, 40, 60, 80, and 100 LIMIT. Position and scale are adjustable in Lua.
  Native portrait, HP, MP, labels, textures, and MDLS files remain untouched.
logo: icon.png
game: kh1
