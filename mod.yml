title: KH1FM Curved HP + Custom MP + Pulsing LIMIT HUD (v1.3)
originalAuthor: Raven Fang
description: >-
  Preserves Sora's face while removing the complete native HP and MP gauges.
  Adds a black-outlined gray/green HP path that grows point-for-point around
  the supplied 1-75 HP curve and then left to the supplied 255 HP length.
  Current HP fills the same path. Retains the always-live Max-MP-scaled bar,
  editable MP gradient/depletion/label, exact five-slot LIMIT gauge, and
  synchronized full-LIMIT outline/text pulse. No DDS or MDLS replacement.
logo: icon.png
