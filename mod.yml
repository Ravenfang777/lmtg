title: KH1FM Smooth Circular HP + Custom MP + Pulsing LIMIT HUD (v1.5)
originalAuthor: Raven Fang
description: >-
  Preserves Sora's face while removing the complete native HP and MP gauges.
  Replaces the square-stamped v1.3 HP curve with a true equal-radius circular
  arc rasterized into smooth native scanlines, then extends the path left above
  75 maximum HP. Uses flicker-safe record publication so HP, MP, and LIMIT stay
  visible throughout the full-LIMIT color pulse. Retains the user's revised HP,
  MP, LIMIT, label, color, pulse, scale, and position settings. No DDS or MDLS
  replacement.
logo: icon.png
game: kh1
