title: KH1FM Custom MP Bar + Exact Pulsing LIMIT Gauge (v1.1)
originalAuthor: Raven Fang
description: >-
  Completely removes Sora's native MP gauge, charge strip, capacity packets,
  MP layer, and MP label. Adds a continuously proportional, always-live custom
  MP bar with editable position, scale, length, height, colors, fill direction,
  and label text. Reconstructs the supplied 0/80/100 five-slot LIMIT references
  exactly; at 100 the teal outline slowly pulses to white and back. LIMIT
  mechanics, native portrait, and native HP remain unchanged. No DDS or MDLS
  replacement is used.
logo: icon.png
game: kh1
