title: KH1FM Max-MP-Scaled Bar + Pulsing LIMIT Gauge (v1.2)
originalAuthor: Raven Fang
description: >-
  Completely removes Sora's native MP gauge, charge strip, capacity packets,
  MP layer, and MP label. Adds an always-live MP bar whose fixed right edge
  expands left from 7 pixels at 10 maximum MP to 179 pixels at 255 maximum MP.
  Capacity lengths, five-stop vertical gradients, depletion direction,
  position, scale, and right-side label are editable. Reconstructs the supplied
  0/80/100 five-slot LIMIT references exactly; at 100 the outline and LIMIT
  text pulse together with editable speed and colors. LIMIT mechanics, native
  portrait, and native HP remain unchanged. No DDS or MDLS replacement is used.
logo: icon.png
game: kh1
