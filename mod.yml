title: KH1FM Smooth Circular HP + Custom MP + Pulsing LIMIT HUD (v1.7)
originalAuthor: Raven Fang
description: >-
  Preserves Sora's face while removing the complete native HP and MP gauges.
  Replaces the square-stamped v1.3 HP curve with a true equal-radius circular
  arc rasterized into smooth native scanlines, then extends the path left above
  75 maximum HP. Uses fresh-frame assembly so cached HP geometry cannot grow
  when MP changes or LIMIT pulses. Retains the user's edited v1.6 settings,
  adds a fourth fixed black box at X=0/Y=0, and adds a fifth black box that
  follows and rotates with the maximum-HP endpoint as a true end cap. No DDS
  or MDLS replacement.
logo: icon.png
game: kh1
