title: KH1FM Adjustable Five-Slot LIMIT Gauge (v2)
originalAuthor: Raven Fang
description: >-
  Adds a red LIMIT label and five persistent shaped black slots to KH1FM Steam
  Global. One slot changes to a red fill with a cyan-teal outline at 20, 40,
  60, 80, and 100 LIMIT. The complete layout defaults to X=0, Y=0 and is
  adjustable through a single origin/scale block. Uses native HUD geometry and
  replaces no DDS or MDLS asset.
logo: icon.png
game: kh1
