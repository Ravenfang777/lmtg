title: KH1FM Exact Five-Slot LIMIT Gauge (v2.2)
originalAuthor: Raven Fang
description: >-
  Reproduces the supplied empty and full five-slot LIMIT gauge references
  exactly at the default settings. Slots use the exact sampled gray, black,
  red, dark-red, and cyan-teal colors and fill at 20, 40, 60, 80, and 100
  LIMIT. Position and scale remain adjustable in Lua. Native portrait, HP, MP,
  labels, textures, and MDLS files remain untouched.
